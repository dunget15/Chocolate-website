<!DOCTYPE html>
<html lang="en">
<head>

  <main style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background-color:var(--dark);">

      <!-- Illustration placeholder -->
      <div style="width:280px;height:320px;border:1px dashed rgba(245,240,232,0.15);display:flex;align-items:center;justify-content:center;margin:8px 0;">
        <p style="font-size:10px;letter-spacing:0.25em;color:rgba(245,240,232,0.2);font-family:var(--sans);">ILLUSTRATION</p>
